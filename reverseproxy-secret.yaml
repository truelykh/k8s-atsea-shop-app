apiVersion: v1
kind: Secret
metadata:
  name: reverseproxy-tls-secret
  namespace: atsea
  labels:
    app: atsea-reverseproxy
type: kubernetes.io/tls
data:
  # Replace these with your actual base64-encoded TLS certificate and key
  # Generate self-signed cert for dev:
  #   openssl req -x509 -nodes -days 365 -newkey rsa:2048 \
  #     -keyout tls.key -out tls.crt -subj "/CN=atseashop.com"
  # Then base64 encode:
  #   cat tls.crt | base64 | tr -d '\n'
  #   cat tls.key | base64 | tr -d '\n'
  tls.crt: 
  tls.key: 
---
